services:
  backend1:
    build: ./backend
    environment:
      INSTANCE_ID: "1"
      PORT: "3000"
    expose:
      - "3000"

  backend2:
    build: ./backend
    environment:
      INSTANCE_ID: "2"
      PORT: "3000"
    expose:
      - "3000"

  backend_backup:
    build: ./backend
    environment:
      INSTANCE_ID: "backup"
      PORT: "3000"
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend_backup

  haproxy:
    image: haproxy:3.0-alpine
    ports:
      - "8081:80"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - backend1
      - backend2
      - backend_backup
